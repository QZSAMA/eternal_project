<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的故事</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f6c85f'/%3E%3Cpath d='M32 46S14 36 14 24c0-6 4-10 10-10 4 0 7 2 8 6 1-4 4-6 8-6 6 0 10 4 10 10 0 12-18 22-18 22Z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <!-- 1920×1080 固定舞台，等比缩放适配投屏 -->
  <main class="stage" id="stage">

    <!-- 背景层：双层交叉淡入 -->
    <div class="layer-bg" id="layerBg">
      <img class="bg-img bg-img-a" id="bgA" alt="">
      <img class="bg-img bg-img-b" id="bgB" alt="">
    </div>

    <!-- 立绘层：左/中/右三槽 -->
    <div class="layer-chars" id="layerChars">
      <div class="char-slot char-slot--left" id="charLeft"></div>
      <div class="char-slot char-slot--center" id="charCenter"></div>
      <div class="char-slot char-slot--right" id="charRight"></div>
    </div>

    <!-- 粒子层 -->
    <canvas class="layer-particles" id="particles" width="1920" height="1080"></canvas>

    <!-- 对话框层 -->
    <div class="layer-dialogue" id="layerDialogue">
      <div class="dialogue-box" id="dialogueBox" role="log" aria-live="polite" aria-atomic="true">
        <div class="name-tag" id="nameTag"></div>
        <div class="text" id="dialogueText"></div>
        <div class="arrow" id="dialogueArrow">▼</div>
      </div>
    </div>

    <!-- 选项菜单层 -->
    <div class="layer-menu" id="layerMenu">
      <div class="choice-panel" id="choicePanel" role="dialog" aria-modal="true" aria-labelledby="choicePrompt">
        <div class="choice-prompt" id="choicePrompt" role="heading" aria-level="2"></div>
        <div class="choice-list" id="choiceList"></div>
      </div>
    </div>

    <!-- 全屏特效层 -->
    <div class="layer-effects" id="layerEffects">
      <div class="effect-flash" id="effectFlash"></div>
      <div class="effect-spotlight" id="effectSpotlight"></div>
    </div>

    <!-- HUD 层：静音按钮 -->
    <div class="layer-hud" id="layerHud">
      <button class="hud-btn" id="muteBtn" title="静音切换" aria-label="静音切换" aria-pressed="false">♪</button>
    </div>

    <!-- 回忆泡泡层：自动轮播，不提供回忆选择 -->
    <div class="layer-memory" id="layerMemory" aria-live="polite">
      <div class="memory-bubble" id="memoryBubble">
        <div class="memory-photo" id="memoryPhoto" role="img" aria-label="回忆照片"></div>
        <div class="memory-copy">
          <div class="memory-meta" id="memoryMeta"></div>
          <div class="memory-caption" id="memoryCaption"></div>
        </div>
      </div>
      <button class="memory-but" id="memoryBut" type="button">但是…</button>
      <div class="memory-final" id="memoryFinal" role="status" aria-live="assertive"></div>
    </div>

    <!-- 兼容旧脚本的蒙太奇层（新剧情不再调用） -->
    <div class="layer-montage" id="layerMontage">
      <div class="montage-img" id="montageImg"></div>
      <div class="montage-caption" id="montageCaption"></div>
      <div class="montage-controls" aria-label="照片蒙太奇控制">
        <button class="montage-toggle" id="montageToggle" type="button" aria-label="暂停照片蒙太奇" aria-pressed="false">暂停</button>
        <span class="montage-status" id="montageStatus" role="status" aria-live="polite">播放中</span>
      </div>
    </div>

    <!-- 小游戏层：逆转的奶 -->
    <div class="layer-minigame" id="layerMinigame">
      <div class="mg-wrap">
        <canvas id="minigameCanvas" width="1280" height="720" role="application" aria-label="我需要治疗：观察莫伊拉的紫球，按 X 请求治疗"></canvas>
        <div class="mg-hud">
          <div class="mg-hp-bar"><div class="mg-hp-fill" id="mgHpFill"></div></div>
          <div class="mg-hp-label">雾子血量</div>
          <div class="mg-timer" id="mgTimer">90</div>
          <div class="mg-floats" id="mgFloats"></div>
          <div class="mg-result" id="mgResult" role="status" aria-live="polite"></div>
        </div>
        <button class="mg-heal-btn" id="mgNeedHealing" type="button">X&nbsp; 我需要治疗</button>
        <div class="mg-voice-status" id="mgVoiceStatus" role="status" aria-live="polite"></div>
        <button class="mg-skip" id="mgSkip" type="button" aria-label="跳过小游戏">跳过 ▶</button>
        <div class="mg-hint" id="mgHint">莫伊拉正在投掷紫球 · 按 X 或点击“我需要治疗”</div>
      </div>
    </div>

    <!-- 求婚层 -->
    <div class="layer-proposal" id="layerProposal">
      <div class="ring-wrap" id="ringWrap">
        <svg class="ring" viewBox="0 0 240 260" width="280" height="280" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="ringPlatinum" x1="0%" y1="0%" x2="100%" y2="75%">
              <stop offset="0%" stop-color="#637c96"/>
              <stop offset="24%" stop-color="#f5fcff"/>
              <stop offset="43%" stop-color="#98b3c8"/>
              <stop offset="67%" stop-color="#ffffff"/>
              <stop offset="85%" stop-color="#8299af"/>
              <stop offset="100%" stop-color="#d7e9f4"/>
            </linearGradient>
          </defs>
          <ellipse cx="120" cy="163" rx="64" ry="72" fill="none" stroke="#344b63" stroke-width="18"/>
          <ellipse cx="120" cy="160" rx="64" ry="72" fill="none" stroke="url(#ringPlatinum)" stroke-width="12"/>
          <path d="M65 188 A60 68 0 0 0 164 207" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>
          <!-- Raised shoulders and four prongs support the faceted solitaire. -->
          <path d="M66 118 L90 85 M174 118 L150 85 M99 100 L109 120 L131 120 L141 100" fill="none" stroke="url(#ringPlatinum)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <g class="diamond" stroke="#eafaff" stroke-width="1.2" stroke-linejoin="round">
            <path d="M76 62 L95 37 H145 L164 62 L120 116 Z" fill="#b4ddec"/>
            <path d="M95 37 L105 62 H135 L145 37 Z" fill="#fff"/>
            <path d="M76 62 L95 37 L105 62 Z" fill="#d8f5ff"/>
            <path d="M135 62 L145 37 L164 62 Z" fill="#8dbcd5"/>
            <path d="M76 62 H105 L120 116 Z" fill="#77adc9"/>
            <path d="M105 62 H135 L120 116 Z" fill="#f4fdff"/>
            <path d="M135 62 H164 L120 116 Z" fill="#bde9fa"/>
          </g>
          <path d="M78 60 L86 71 M162 60 L154 71 M101 99 L108 108 M139 99 L132 108" fill="none" stroke="url(#ringPlatinum)" stroke-width="5" stroke-linecap="round"/>
          <g fill="#fff">
            <path d="M172 27 L175 38 L186 41 L175 44 L172 55 L169 44 L158 41 L169 38 Z"/>
            <path d="M66 76 L68 83 L75 85 L68 87 L66 94 L64 87 L57 85 L64 83 Z" opacity=".8"/>
          </g>
        </svg>
        <div class="ring-glow" id="ringGlow" aria-hidden="true"></div>
      </div>
      <div class="proposal-text" id="proposalText" aria-live="assertive"></div>
      <div class="proposal-btns" id="proposalBtns">
        <button class="btn-accept" id="btnAccept" type="button">我愿意 ♥</button>
        <button class="btn-reject" id="btnReject" type="button" aria-label="让我想想">让我想想…</button>
      </div>
      <div class="reject-tip" id="rejectTip"></div>
    </div>

    <!-- 结尾画面层 -->
    <div class="layer-ending" id="layerEnding">
      <div class="ending-content">
        <div class="ending-big" id="endingBig" lang="en"></div>
        <div class="ending-sub" id="endingSub"></div>
        <div class="ending-meta" id="endingMeta"></div>
        <button class="ending-restart" id="endingRestart" type="button">重新开始</button>
      </div>
      <div class="ending-continuation" id="endingContinuation"></div>
      <div class="ending-confirm" id="endingConfirm" role="dialog" aria-modal="true" aria-labelledby="endingConfirmTitle" hidden>
        <div class="ending-confirm-panel">
          <h2 id="endingConfirmTitle">要重新开始我们的故事吗？</h2>
          <div class="ending-confirm-actions">
            <button id="endingConfirmYes" type="button">重新开始</button>
            <button id="endingConfirmNo" type="button">先留在这里</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 配置/运行时错误层 -->
    <div class="layer-error" id="layerError" role="alert" aria-live="assertive">
      <div class="error-panel">
        <h2>无法开始这一段故事</h2>
        <p id="errorText"></p>
        <button id="errorReload" type="button">返回开始页</button>
      </div>
    </div>

    <!-- 开始界面层 -->
    <div class="layer-start" id="layerStart">
      <img class="start-art" src="assets/images/photos/photo2.jpg" alt="" aria-hidden="true">
      <div class="start-screen">
        <div class="start-kicker"><span aria-hidden="true"></span>CO-OP STORY MODE / ONLINE</div>
        <div class="start-display" aria-hidden="true"><span>OUR</span><strong>STORY</strong></div>
        <div class="start-save"><span>SAVE SLOT 01</span><h1 class="start-title" id="startTitle">我们的故事</h1></div>
        <p class="start-sub" id="startSub">两个人的主线任务，从这一刻继续</p>
        <button class="start-btn" id="startBtn" type="button">
          <span class="start-play" aria-hidden="true">▶</span>
          <span>开始双人旅程</span>
        </button>
      </div>
      <button class="start-mute" id="startMuteBtn" type="button" title="静音切换" aria-label="静音切换" aria-pressed="false">♪</button>
      <div class="start-sync" aria-hidden="true">
        <span>SYNC RATE</span><strong>100%</strong><small>PLAYER 1 + PLAYER 2</small>
      </div>
    </div>

  </main>

  <!-- 加载顺序：数据 → 音频 → 小游戏 → 引擎（全部本地） -->
  <script src="js/storyData.js?v=6"></script>
  <script src="js/configValidation.js?v=1"></script>
  <script src="js/minigameMode.js?v=1"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/minigame.js?v=6"></script>
  <script src="js/engine.js?v=6"></script>
</body>
</html>
